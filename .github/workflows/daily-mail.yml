name: Daily important mail to KakaoTalk

on:
  schedule:
    # GitHub cron is UTC. 01:00 UTC = 10:00 Asia/Seoul.
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Check mail and send KakaoTalk summary
        env:
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          NATE_EMAIL: ${{ secrets.NATE_EMAIL }}
          NATE_PASSWORD: ${{ secrets.NATE_PASSWORD }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_LINK_URL: ${{ secrets.KAKAO_LINK_URL }}
          LOOKBACK_HOURS: '28'
          IMPORTANCE_THRESHOLD: '4'
          SEND_EMPTY_SUMMARY: 'false'
        run: npm start
